name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          # Main/orchestrator model: Sonnet. It coordinates and answers simple
          # questions itself; heavier or cheaper work goes to the subagents below.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 60
            --allowedTools "Edit,Write,Task,Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
            --append-system-prompt "Be concise and focus only on files relevant to the request. Workflow for any task involving code changes: 1) send the task to 'planner' (Opus) to produce a step-tagged plan; 2) dispatch [MECHANICAL] steps to 'executor' (Haiku) and [JUDGMENT] steps to 'fixer' (Sonnet); 3) if the executor escalates a failure, send that step plus the error report to 'fixer', then resume remaining mechanical steps on 'executor'; 4) if fixer says the plan is invalid, go back to 'planner' once. Use 'runner' (Haiku) for standalone searches, npm scripts, and log reading. For trivial questions or one-line edits, answer or edit directly without spawning subagents. Never let executor retry a failed step more than twice."
